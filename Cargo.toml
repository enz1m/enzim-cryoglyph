[package]
name = "cryoglyph"
description = "Fast, simple 2D text rendering for wgpu. A fork of glyphon for iced."
version = "0.1.0"
edition = "2024"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
repository = "https://github.com/iced-rs/cryoglyph"
license = "MIT OR Apache-2.0 OR Zlib"

[dependencies]
wgpu = { version = "29", git = "https://github.com/enz1m/enzim-wgpu.git", rev = "7f040c8501f6838262c90ede4edfa40940fe2de8", default-features = false, features = ["wgsl"] }
etagere = "0.2"
cosmic-text = { version = "0.19", git = "https://github.com/enz1m/enzim-cosmic-text.git", rev = "ad474131e52c0fde5979f8def2889489b50a0480" }
lru = { version = "0.18.2", default-features = false }
rustc-hash = "2"

[dev-dependencies]
wgpu = { version = "29", git = "https://github.com/enz1m/enzim-wgpu.git", rev = "7f040c8501f6838262c90ede4edfa40940fe2de8", default-features = false, features = ["std", "vulkan"] }
winit = "0.30"
pollster = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "prepare"
harness = false
